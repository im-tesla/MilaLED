[platformio]
; Available ESP32 boards:
;   esp32-c3-supermini, esp32dev, nodemcu-32s, esp32-s3-devkitc-1, esp32-c6-devkitc-1
default_envs = esp32-c3-supermini

; ── ESP32 Common ───────────────────────────────────────────────
[env]
platform  = espressif32
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed  = 921600
lib_deps  =
  fastled/FastLED
  links2004/WebSockets
  bblanchon/ArduinoJson
  h2zero/NimBLE-Arduino@^2.5.1

; ── ESP32 Boards ───────────────────────────────────────────────
[env:esp32-c3-supermini]
board = lolin_c3_mini
board_build.partitions = partitions_c3.csv
board_build.flash_mode = dio
monitor_rts = 0
monitor_dtr = 0

[env:esp32dev]
board = esp32dev
board_build.partitions = partitions_esp32.csv

[env:nodemcu-32s]
board = nodemcu-32s2
board_build.partitions = partitions_esp32.csv

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

[env:esp32-c6-devkitc-1]
board = esp32-c6-devkitc-1

; ── Native test env ────────────────────────────────────────────
[env:native]
platform = native
test_filter = test_pixel_mapper
